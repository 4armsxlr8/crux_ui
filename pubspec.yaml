name: crux_ui
description: >-
  A playful Flutter UI kit. Ships design tokens (colors, spacing,
  typography, radii), a theme layer, and six widget atoms: CruxButton,
  CruxChip, CruxCard, CruxListTile, CruxSwitch, and CruxDivider.
version: 0.3.0

topics:
  - ui
  - widgets
  - design-system

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  motor: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

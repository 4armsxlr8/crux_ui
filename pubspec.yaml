name: crux_ui
description: >-
  A playful Flutter UI kit. Design tokens, a theme layer, and eighteen
  components: CruxButton, CruxChip, CruxCard, CruxListTile,
  CruxSwitch, CruxDivider, CruxTextFormField, CruxInputBar,
  CruxComposer, CruxSpinner, CruxIconButton, CruxCheckbox,
  CruxDialog (with CruxConfirmDialog), CruxToast,
  CruxSegmentedControl, CruxSlider, CruxNavBar, CruxTopFade.
version: 0.10.0

topics:
  - ui
  - widgets
  - design-system
  - form

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  motor: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only: test/tokens/native_scale_parity_test.dart checks that the Apple
  # tier of CruxTypography still matches this package's HIG constants. Never
  # a runtime dependency — the values are transcribed, not read at run time.
  cupertino_typography: ^0.2.0

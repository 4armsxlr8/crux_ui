name: crux_ui
description: >-
  A playful Flutter UI kit. Design tokens, a theme layer, and sixteen
  components: CruxButton, CruxChip, CruxCard, CruxListTile,
  CruxSwitch, CruxDivider, CruxTextFormField, CruxInputBar,
  CruxComposer, CruxSpinner, CruxIconButton, CruxCheckbox,
  CruxDialog (with CruxConfirmDialog), CruxToast,
  CruxSegmentedControl, CruxSlider.
version: 0.8.0

topics:
  - ui
  - widgets
  - design-system
  - form

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  motor: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
